[workspace]
members = [".", "imzero2_egui"]
# Vendored third-party source (vendor/egui_software_backend, see its
# VENDORING.md) is a path dependency but NOT a member: `check.sh` runs
# `cargo fmt --all` and `cargo clippy --workspace -- -D warnings`, and neither
# should reformat or gate on code we did not write.
exclude = ["vendor/egui_software_backend", "vendor/egui_software_backend/constify"]
resolver = "2"

[package]
name = "imzero2"
version = "0.1.0"
authors = ["Panos Stergiotis <p@stergiotis.ch>"]
edition = "2024"
include = ["**/*.rs", "Cargo.toml"]
# The real floor, and lower than the 1.96 in ./rust-toolchain on purpose: that
# file is the toolchain the build *uses*, this is the oldest one the crate
# graph still compiles under. 1.94 because h3o 0.10 calls f64::mul_add from a
# const fn and rustc const-stabilised that in 1.94 — 1.93 fails to build h3o
# (see ADR-0095, 2026-07-28). h3o declares no `rust-version` of its own, so
# cargo's MSRV-aware resolver cannot derive this; it was measured by building
# under each toolchain.
rust-version = "1.94"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "imzero2_ws_probe"
path = "src/bin/ws_probe.rs"
required-features = ["headless"]

[features]
# ADR-0024 SD1: two binary targets, one source tree. `desktop` (default)
# keeps the eframe + winit host for hmi.sh; `headless` selects the
# render-to-texture host (hand-rolled egui::Context + egui_wgpu loop, no
# window system) that feeds the remote-access pixel pipeline. The FFFI2
# interpreter body is shared verbatim between the two hosts.
#
# `inspection` rides along in the desktop default so every desktop build is
# egui_mcp-capable without a bespoke rebuild; it stays dormant until the
# EGUI_INSPECTION env var opens the port (see the `inspection` feature note
# below). Headless builds pass `--no-default-features`, so they never pick it
# up — and could not, since `inspection` pulls in the eframe-only `desktop`.
default = ["desktop", "inspection", "fast_alloc"]
# egui-wgpu is pulled in transitively by eframe under `desktop`; declare it on
# the feature too so `entry.rs` can name `egui_wgpu::wgpu::PresentMode` when
# mapping the `-vsync` flag onto the wgpu swapchain (eframe 0.35 dropped the
# `NativeOptions::vsync` field). headless already enables it; headless_svg does
# not, keeping that host GPU-less.
desktop = ["dep:eframe", "dep:egui-wgpu"]
# ADR-0128 M3 — the appliance-host split. `headless` is the carrier + FFFI2
# host with NO wgpu and NO ffmpeg: the mesh draw-stream lane only (SD6), which
# is the lean appliance build. `headless_wgpu` adds the offscreen wgpu renderer
# + GPU→CPU readback that the video codecs, the PNG dump, and the H264_OUT file
# sink all require; it is the full dev/desktop-adjacent host. The mesh *wire* is
# byte-identical between the two, so a stream verified under `headless_wgpu` is
# exactly what the lean `headless` build serves. `cargo tree --features headless`
# carries no wgpu — the hard guarantee the appliance target needs.
headless = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:prost",
    "dep:futures-util",
]
#
# `headless_raster` is the capability both pixel hosts share: "this build can
# rasterize a frame into host memory". Everything downstream of a frame — the
# PNG dump, the ADR-0154 capture request, the ffmpeg encoder lane, the
# carrier's video path — keys off it and does not care which rasterizer
# produced the bytes. It is not meant to be selected on its own; pick one of
# the two hosts below.
headless_raster = ["headless"]
headless_wgpu = ["headless_raster", "dep:wgpu", "dep:egui-wgpu", "dep:pollster"]
# GPU-less pixel host: the same frames, rasterized on the CPU by the vendored
# `egui_software_backend`. No wgpu, no Vulkan loader, no ICD — `cargo tree
# --features headless_soft` carries none of it, and neither does the runtime
# image. A build enabling both raster hosts resolves to wgpu rather than
# failing (ADR-0205 SD1; headless.rs gates the CPU host on
# `not(feature = "headless_wgpu")`). ffmpeg is still reachable, since the
# encoder takes BGRA from host memory either way. See
# doc/adr-background-work/egui-software-backend-survey.md.
headless_soft = [
    "headless_raster",
    "dep:egui_software_backend",
    "dep:bytemuck",
    "dep:rayon",
]
# GPU-less, SVG-only host (headless_svg.rs). Drives the shared FFFI2
# interpreter with `ctx.run_ui` and lets the always-registered SVG-export
# plugin (apphost::init_common) write files on ExportSvg / ExportSvgWindow.
# No wgpu/winit/ffmpeg — SVG export reads egui's pre-tessellation shapes, so
# no GPU device is needed. Adds no dependencies (egui + svgexport are core).
# Intended client binary for serving imzero2 views as SVG over HTTP.
headless_svg = []
# egui_mcp app-side hook (rerun-io/kittest_inspector's `egui_mcp`). Turns on
# eframe's `inspection` feature → the `egui_inspection` egui::Plugin, which
# eframe's wgpu integration auto-attaches at startup when the EGUI_INSPECTION
# env var is set (binds 127.0.0.1:5719 by default). No imzero2 code path is
# involved: the plugin reads the AccessKit tree and injects input/screenshot
# requests one layer below the FFFI2 interpreter, so an out-of-process MCP
# agent can drive the desktop host. Desktop host only (eframe).
#
# Bundled into the desktop `default` (above): the code is compiled in but inert
# — eframe attaches the plugin, generates the AccessKit tree, and opens the
# port ONLY when EGUI_INSPECTION is set, so an unset build pays ~0.7 MB of
# binary and no per-frame cost. The runtime env var, not the compile flag, is
# the gate: default off, and its truthy default binds loopback (127.0.0.1)
# only. Two things bound the blast radius of that gate: the port is still
# unauthenticated remote control of the app plus its screen, and 127.0.0.1 is
# host-scoped (any local user), so only enable it on a trusted, ideally
# single-user host; and it cannot reach the remote-access carrier at all, since
# that ships headless (`--no-default-features`) and `inspection` requires the
# eframe-only `desktop`. Precedent for an always-compiled loopback dev port:
# the puffin profiler server (main.rs, under `--features puffin`). See
# doc/howto/egui-mcp.md.
inspection = ["desktop", "eframe?/inspection"]
# The mimalloc global allocator (main.rs), on by default and in every build
# script, so this gate changes no shipped build. It exists to be left OFF: the
# `libmimalloc-sys` build script needs a C toolchain for the target, and it is
# one of exactly two crates that stop `--target x86_64-unknown-linux-musl` from
# checking (the other is `ring`, which arrives via `reqwest` <- `walkers` and
# leaves with ADR-0204 M4). Without it the appliance graph is pure Rust and
# needs no cross C compiler at all. See ADR-0205 M6.
fast_alloc = ["dep:mimalloc"]
puffin = ["dep:puffin", "dep:puffin_http", "profiling/profile-with-puffin"]
dhat-heap = ["dep:dhat"]
wayland = ["eframe?/wayland"]
x11 = ["eframe?/x11"]

[dependencies]
# Pinned to the 0.35 line, and pinned deliberately: every widget crate below
# (egui_extras, egui_table, egui_dock, egui_graphs, walkers) links egui itself,
# so the whole ring has to sit on one egui version or the same type appears
# twice in the graph and nothing typechecks across the seam.
#
# These two carried an open `>=0.35.0` requirement once. A dependabot bump of
# eframe to 0.36.1 then floated egui to 0.36 as well, in a lock-only commit with
# no manifest diff to review: two copies each of egui/emath/epaint/ecolor plus
# two wgpu majors, and 84 type errors reading `expected egui_dock::egui::Ui,
# found egui::Ui`. A caret requirement makes the next such move a visible
# manifest change instead.
#
# The ring can go to 0.36 once egui_graphs releases against it — egui_extras
# 0.36.1, egui_table 0.10, egui_dock 0.21.1 and walkers 0.58 are all out
# already, but egui_graphs 0.31.0 (its newest, and its master branch) still
# asks for egui 0.35. Move all of them, and the wgpu/egui-wgpu pins below, in
# one commit.
egui = "0.35"
eframe = { version = "0.35", optional = true, default-features = false, features = [
    "accesskit",     # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed trust-analyzer.cargo.featureshe default egui fonts.
    "wgpu",          # Use the wgpu rendering backend. Alternative: "glow".
    #"persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # To support Linux (and CI)
    "x11",           # To support older Linux distributions (restores one of the default features)
] }
# Headless host (ADR-0024 SD2): drives egui_wgpu::Renderer directly against
# an offscreen texture; wgpu with default features so the native backends
# (vulkan/gles) are present even when eframe is compiled out.
#
# Pinned to the 29.x line to match egui-wgpu 0.35.0's own `wgpu = "29.0"`
# requirement — Cargo cannot unify a direct `wgpu` dependency with
# egui-wgpu's transitive one across a major-version gap, so a bare bump to
# 30.x (dependabot proposed this once already) links two distinct copies of
# the wgpu types into headless.rs and every `egui_wgpu::Renderer` call site
# fails to typecheck. Move this only alongside an egui-wgpu bump that itself
# picks up wgpu 30 (which rides on an egui major bump — see Cargo.toml's
# `egui`/`eframe` deps).
wgpu = { version = "29.0.1", optional = true }
egui-wgpu = { version = "0.35.0", optional = true }
pollster = { version = "1.0", optional = true }
# ADR-0024 SD4/SD6/SD7: WebSocket carrier + protobuf wire. The proto
# contract lives at proto/boxer/imzero2/v1/input.proto; inputproto.rs
# mirrors it with hand-tagged prost derives until protoc-based codegen
# lands.
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "net", "sync", "time", "io-util", "macros"] }
tokio-tungstenite = { version = "0.30", optional = true }
prost = { version = "0.14", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }
log = "0.4.27"
binary_rw = "4.1.0"
thiserror = "2.0.17"
strum = { version = "0.28", features = ["derive"] }
bitflags = "2.9.4"
roaring = "0.11.2"
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
# Bridges dependencies that log through the `log` crate (walkers, and it is not
# alone) into the tracing subscriber. Declared directly rather than relying on
# tracing-subscriber's builder `init()`, so the bridge's own level cap is ours
# to set — see setup_tracing.
tracing-log = "0.2"
byteorder = "1.5.0"
puffin_http = {version = "0.17.0", optional = true }
puffin = {version = "0.20.0", optional = true }
profiling = "1.0.17"
mimalloc = { version = "0.1.48", optional = true }
dhat = { version = "0.3.3", optional = true }
memmap2 = "0.9.9"
rand = "0.10.2"
blake3 = "1.8.2"
egui_extras = { version = "0.35.0", features = ["default", "datepicker", "serde"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
egui_table = "0.9.0"
egui_dock = "0.20"
egui_graphs = { version = "0.31", features = ["events"] }
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
png = "0.18"
walkers = "0.56"
# Tile downloads for a custom .TileUrl source that needs TLS configuration
# walkers cannot express (imzero2::walkers_tiles). Both crates are already in
# the tree via walkers itself; `blocking` is the only feature that adds
# anything, and it keeps the tile workers off the optional tokio dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
lru = "0.18"
# Used by imzero2::svgexport to read the TTF `name` table at font-load time,
# so SVG export can emit the real family name (e.g. "Noto Sans") instead of
# the generic CSS keyword. Transitively present via ab_glyph; declared
# directly so we don't depend on the transitive version staying stable.
ttf-parser = "0.25"
# Tier-2 SVG export: subset the loaded TTFs to just the glyphs that appear
# in a given frame, embed as base64 @font-face for self-contained pixel-
# perfect rendering. `subsetter` is Typst's pure-Rust subsetter.
subsetter = "0.2"
base64 = "0.23"
h3o = { version = "0.10", features = ["geo"] }
# Concave-polygon fill for the painter (paintPolygonFilled.Concave()):
# ear-clip triangulation → egui::Shape::Mesh, since epaint itself fills
# only convex outlines.
earcutr = "0.5"

# IDS token layer (ADR-0029). Per-app-startup egui::Style overlay; no widgets.
imzero2_egui = { path = "imzero2_egui" }

# CPU rasterizer for the `headless_soft` host. Vendored rather than pulled from
# crates.io — vendor/egui_software_backend/VENDORING.md carries the upstream
# commit, the deltas and the reasoning. `std` buys runtime SIMD dispatch;
# `log` routes the backend's own errors (e.g. an unsupported paint callback)
# into the tracing subscriber. `rayon` parallelises the caching path, which is
# the one this host uses and the reason it is ~4.5x faster than the uncached
# single-threaded path it started on — see softraster.rs and
# doc/adr-background-work/egui-software-backend-survey.md section 12.3.
egui_software_backend = { path = "vendor/egui_software_backend", optional = true, default-features = false, features = [
    "std",
    "log",
    "rayon",
] }
# Already in the graph via the crate above; declared directly so softraster.rs
# can size the global pool rather than take rayon's default, which is every
# hardware thread and measurably past the useful point (section 13.2).
rayon = { version = "1", optional = true }
# One safe cast, in softraster.rs: the frame buffer is a `Vec<u8>` (what every
# sink takes) and the rasterizer wants `&mut [[u8; 4]]`. `unsafe_code = "deny"`
# rules out doing it by hand, and copying instead would cost a full-frame
# memcpy per frame — more than the rasterization itself. Same crate epaint
# uses, so it is one crate in the graph and no new supply-chain surface.
bytemuck = { version = "1.25", optional = true, default-features = false }

[profile.release]
opt-level = 2

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2


[patch.crates-io]

# If you want to use the bleeding edge version of egui and eframe:
# egui = { git = "https://github.com/emilk/egui", branch = "main" }
# eframe = { git = "https://github.com/emilk/egui", branch = "main" }

# If you fork https://github.com/emilk/egui you can test with:
#egui = { path = "../contrib/egui/crates/egui" }
#eframe = { path = "../contrib/egui/crates/eframe" }


