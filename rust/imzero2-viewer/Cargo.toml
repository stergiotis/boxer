[package]
name = "imzero2-viewer"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "Native Windows viewer for the imzero2 WebSocket protocol"

[dependencies]
anyhow = "1"
prost = "0.13"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# tokio-tungstenite's rustls feature leaves the crypto provider to the
# application. Without one, rustls panics on the first wss:// connect — inside
# the network worker, so the viewer sat at "Connecting…" and the host saw no
# request at all. `ring` is the provider (session::spawn installs it
# explicitly), and `tls12` matches what a browser will negotiate with an older
# TLS-terminating proxy.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# SHA-256 of a presented certificate, for TlsVerification::Pinned. Already
# compiled as rustls's provider; this names it directly.
ring = "0.17"
url = "2"

[dev-dependencies]
# The self-signed wss:// peer in session's tests. No default features: those
# would enable rustls's aws-lc-rs provider beside ring (and a cmake build).
tokio-rustls = { version = "0.26", default-features = false }

[build-dependencies]
protox = "0.7"
prost-build = "0.13"
bindgen = "0.72"

[target.'cfg(windows)'.dependencies]
ffmpeg-sys-next = { version = "8", default-features = false, features = ["avcodec"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader",
  "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_SystemServices", "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_Security"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
