# Pinned to the patch release rust/imzero2 pins, so a checkout needs one
# toolchain for every crate under rust/ (rustfmt included: fmt_rust.sh formats
# each crate with its own pin). The crate formats, lints and tests clean on it.
# `stable` is intentionally NOT used: it would float, and with no global rustup
# default configured this file is what lets a bare `cargo` invocation resolve
# a toolchain inside the crate.
[toolchain]
channel = "1.96.1"
components = ["rustfmt", "clippy"]
