[package]
name = "watermark"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cooperative image/session identification through tiled luminance contrast."
license = "MIT OR Apache-2.0"

# Library (src/lib.rs) + CLI binary (src/main.rs, target name `watermark`).

[dependencies]
# PNG I/O only — default features off keeps the transitive graph small (no
# gif/webp/jpeg codecs). The watermark works in luma, but PNG is the friendly
# interchange format for `encode`/`decode`.
image = { version = "0.25", default-features = false, features = ["png"] }
# CLI: encode / decode / roundtrip / sweep subcommands.
clap = { version = "4", features = ["derive"] }
# Deterministic, seedable RNG for payload generation in the CLI and tests.
rand = "0.10"
# RAII scratch directories for the ffmpeg round-trip (codec.rs): the encode/
# decode intermediates are cleaned up on drop, including on an early `?`
# return, instead of the previous manual `create_dir_all` + best-effort
# `remove_dir_all` pair.
tempfile = "3"

# CRC and Golay are implemented in-crate. The locator searches reference-cell
# covariance at a fixed tile period; no FFT dependency is needed.

[profile.release]
opt-level = 3
