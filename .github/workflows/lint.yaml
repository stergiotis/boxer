name: lint
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for llmtag authorship analysis
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Setup
        run: ./scripts/ci/install.sh
      # The Rust gates inside lint.sh — h3_wasm_parity and rust_imzero2_check —
      # skip silently when their toolchain is absent, and nothing here installed
      # one, so "CI is the enforcer" was not true of either: the byte-parity
      # check for the committed h3.wasm had never run. wabt and binaryen matter
      # as much as rustc: the committed blob is the OUTPUT of wasm-strip +
      # wasm-opt -Oz, so without them the gate cannot reproduce it and skips.
      - name: Install the pinned Rust toolchain and wasm tooling
        run: |
          set -euo pipefail
          ch=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust/h3bridge/rust-toolchain.toml | head -1)
          [ -n "$ch" ] || { echo "no channel pin in rust/h3bridge/rust-toolchain.toml" >&2; exit 1; }
          rustup toolchain install "$ch" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wabt binaryen
      - name: Lint
        run: ./scripts/ci/lint.sh
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
