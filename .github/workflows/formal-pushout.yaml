name: formal-pushout

# Machine-checks the pushout protocol specs under
# verification/formal/algebraicarch/pushout: Quint typecheck + witness runs,
# randomized sweeps, Apalache bounded verifies, TLC liveness, and the
# expected-violation counterexamples. What each step proves, at which depth,
# is tabulated in that directory's README.md ("Status by file").

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  TLA_TOOLS_VERSION: v1.8.0

defaults:
  run:
    working-directory: verification/formal/algebraicarch/pushout

jobs:
  check:
    name: quint + apalache + tlc
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: verification/formal/algebraicarch/pushout/package-lock.json
      # Apalache (quint verify) and TLC both run on the JVM.
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install quint
        run: npm ci
      # quint downloads the Apalache distribution and the Rust evaluator into
      # ~/.quint on first use; key the cache on the pinned quint version.
      - name: Cache Apalache and the quint evaluator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.quint
          key: quint-home-${{ runner.os }}-${{ hashFiles('verification/formal/algebraicarch/pushout/package-lock.json') }}
      - name: Cache tla2tools.jar
        id: tla-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tlaplus/tla2tools.jar
          key: tla2tools-${{ env.TLA_TOOLS_VERSION }}
      - name: Download tla2tools.jar
        if: steps.tla-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.tlaplus
          curl -fsSL -o ~/.tlaplus/tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_TOOLS_VERSION}/tla2tools.jar"
      - name: Tool versions
        run: |
          node --version
          npx quint --version
          java -version
          java -cp ~/.tlaplus/tla2tools.jar tlc2.TLC -h | head -n 3 || true
      # typecheck + test + sweep + verify:all + liveness:all
      - name: Check (positive results)
        run: npm run check
      # The counterexample specs must still produce their violations.
      - name: Findings (expected violations)
        run: npm run findings
