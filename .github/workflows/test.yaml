name: Run all tests

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gotest:
    name: gotest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Setup
        run: ./scripts/ci/install.sh
      - name: Check go.mod/go.sum are tidy
        run: go mod tidy --diff
      - name: Verify module checksums
        run: go mod verify
      - name: Run Tests
        run: ./scripts/ci/gotest.sh
      # Generator tests regenerate *.out.* files in place; a dirty tree here
      # means the committed generated code has drifted from its generators.
      - name: Check generated code is drift-free
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "$status"
            git diff
            echo "::error::The test run left the tree dirty — committed generated code drifted from its generators (or a test wrote into the tree). Regenerate locally and commit the result."
            exit 1
          fi

  viewer:
    name: viewer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the crate's own pin rather than hardcoding it here, the same way
      # watermark.yaml and lint.yaml read theirs — one file to update when the
      # crate's toolchain moves.
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          ch=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust/imzero2-viewer/rust-toolchain.toml | head -1)
          [ -n "$ch" ] || { echo "no channel pin in rust/imzero2-viewer/rust-toolchain.toml" >&2; exit 1; }
          rustup toolchain install "$ch" --profile minimal --component rustfmt,clippy

      # No ffmpeg, MinGW or Windows libraries: this lane is the ADR-0243 §SD5
      # "Linux unit tests cover framing, session transitions, geometry and input
      # state without Windows dependencies" half. Everything under src/win is
      # cfg(windows), so neither these tests nor the clippy step reach it — the
      # cross-build and Wine lanes are separate and are not run here.
      - name: Test
        run: ./scripts/ci/viewer_test.sh

  gotest-binary-log:
    name: gotest (binary_log)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Setup
        run: ./scripts/ci/install.sh
      - name: Run binary_log Tests
        run: ./scripts/ci/gotest_binary_log.sh
      - name: Check generated code is drift-free
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "$status"
            git diff
            echo "::error::The test run left the tree dirty — committed generated code drifted from its generators (or a test wrote into the tree). Regenerate locally and commit the result."
            exit 1
          fi
