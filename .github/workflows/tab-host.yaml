name: tab-host
# ADR-0278 SD5 (proposed): build the Rust browser host a browser tab runs
# beside the Go module, check it against the digest the tree records in
# browserhost.sum, and publish it on GitHub Pages under that digest, so a
# module consuming boxer can fetch the host its pin needs without a Rust
# toolchain (`bundle` of a tab binary). Nothing published is ever removed: a
# consumer pinned to an older commit fetches an older digest. The site is
# rebuilt from what is already published plus the new file, and a run that
# cannot read back everything already published fails instead of deploying a
# smaller site.
#
# A manual run can also build the demo (ADR-0278 Update 2026-10-04): the
# imzero2tabdemo tab binary — apps that need no data and no host service, so
# the published page reaches no third-party endpoint — bundled with this
# commit's host and published under demo/. A run that does not build it
# carries the published demo over unchanged, as it does the hosts.
#
# Runs on manual dispatch only (ADR-0278 Update 2026-10-06): a push no longer
# builds or checks the host, so a stale browserhost.sum surfaces at the next
# dispatch, and a host is published only when someone dispatches.
on:
  workflow_dispatch:
    inputs:
      demo:
        description: 'Also build and publish the demo under demo/'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ROOT: https://stergiotis.github.io/boxer
  SITE: https://stergiotis.github.io/boxer/tabhost
  SUM: public/thestack/imzero2/browserhost/tabhost/browserhost.sum
  HOST: rust/imzero2/target/browser/wasm32-unknown-unknown/release/imzero2_browser.wasm

jobs:
  build:
    name: build and check
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.site.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          ch=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust/imzero2/rust-toolchain | head -1)
          [ -n "$ch" ] || { echo "no channel pin in rust/imzero2/rust-toolchain" >&2; exit 1; }
          rustup toolchain install "$ch" --profile minimal --target wasm32-unknown-unknown
      - name: Build the browser host
        run: rust/imzero2/build_rust_browser.sh
      - name: Check it against browserhost.sum
        run: |
          set -euo pipefail
          want=$(awk '$1=="sha256"{print $2}' "$SUM")
          got=$(sha256sum "$HOST" | cut -d' ' -f1)
          echo "built $got, recorded $want"
          if [ "$got" != "$want" ]; then
            echo "::error file=$SUM::the browser host this tree builds ($got) is not the one browserhost.sum records ($want). A commit changed rust/imzero2 (or regenerated the bindings) without refreshing the file; the build is reproducible, so this is the tree moving, not CI. Run 'go run ./public/thestack/cmd/imzero2tab hostdigest --write' on the commit being pushed and commit the file (AGENTS.md, Browser host digest)."
            exit 1
          fi
      - name: Set up Go
        if: inputs.demo == true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Build the demo
        if: inputs.demo == true
        run: |
          set -euo pipefail
          # egui's built-in faces plus the vendored icon font: no system fonts
          # whose set and licences depend on the runner.
          mkdir -p demo-fonts
          cp rust/imzero2/assets/fonts/phosphor/Phosphor.ttf demo-fonts/phosphor.ttf
          go run ./public/thestack/cmd/imzero2tabdemo bundle --out demo --host "$HOST" --fonts demo-fonts --withAssets
          cp rust/imzero2/assets/fonts/phosphor/LICENSE demo/fonts/phosphor-LICENSE.txt
      - name: Assemble the site
        id: site
        run: |
          set -euo pipefail
          got=$(sha256sum "$HOST" | cut -d' ' -f1)
          mkdir -p site/tabhost
          code=$(curl -sS -o site/tabhost/index.txt -w '%{http_code}' "$SITE/index.txt" || true)
          case "$code" in
            200) ;;
            404) : > site/tabhost/index.txt; echo "nothing published yet" ;;
            *) echo "::error::reading $SITE/index.txt answered $code; not deploying a site that could drop published hosts"; exit 1 ;;
          esac
          published=false
          if grep -qx "$got" site/tabhost/index.txt; then
            echo "$got is published already"
            published=true
          fi
          if [ "$published" = true ] && [ ! -d demo ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while read -r d; do
            [ -n "$d" ] || continue
            curl -fsS -o "site/tabhost/$d.wasm" "$SITE/$d.wasm"
            [ "$(sha256sum "site/tabhost/$d.wasm" | cut -d' ' -f1)" = "$d" ] || { echo "::error::published $d.wasm does not match its digest"; exit 1; }
          done < site/tabhost/index.txt
          cp "$HOST" "site/tabhost/$got.wasm"
          { cat site/tabhost/index.txt; echo "$got"; } | grep -v '^$' | sort -u > site/tabhost/index.new
          mv site/tabhost/index.new site/tabhost/index.txt
          # The demo: this run's build, or the published one carried over.
          if [ -d demo ]; then
            cp -r demo site/demo
          else
            code=$(curl -sS -o demo-files.txt -w '%{http_code}' "$ROOT/demo/files.txt" || true)
            case "$code" in
              200)
                while read -r f; do
                  [ -n "$f" ] || continue
                  mkdir -p "site/demo/$(dirname "$f")"
                  curl -fsS -o "site/demo/$f" "$ROOT/demo/$f"
                done < demo-files.txt ;;
              404) echo "no demo published" ;;
              *) echo "::error::reading $ROOT/demo/files.txt answered $code; not deploying a site that could drop the demo"; exit 1 ;;
            esac
          fi
          if [ -d site/demo ]; then
            (cd site/demo && find . -type f ! -name files.txt | sed 's|^\./||' | sort > files.txt)
          fi
          # The landing page is .github/pages/index.html, styled by the IDS
          # classless stylesheet (ADR-0076) published beside it; its demo
          # section is dropped while no demo is published.
          cp public/keelson/designsystem/web/ids.css public/keelson/designsystem/web/ids-palette.css site/
          if [ -d site/demo ]; then
            cp .github/pages/index.html site/index.html
          else
            sed '/<!-- demo -->/,/<!-- \/demo -->/d' .github/pages/index.html > site/index.html
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Upload the site
        if: steps.site.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
