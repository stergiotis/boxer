name: fuzz

# ADR-0390: the weekly fuzz lane. Runs every Go fuzz target through
# scripts/ci/gofuzz.sh for a bounded time each and, when a target fails,
# uploads the minimised inputs it wrote under testdata/fuzz/ together with the
# per-target logs, so the input can be committed as a regression seed with the
# fix. Plain `go test` already replays the committed seeds every run.
on:
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Per-target -fuzztime (a duration or Nx count)'
        type: string
        default: '30s'
  schedule:
    - cron: '23 4 * * 6'

permissions:
  contents: read

jobs:
  fuzz:
    name: gofuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Setup
        run: ./scripts/ci/install.sh
      # 30s per target by default: FuzzAstRoundTrip grows ANTLR's DFA cache
      # without bound and is OOM-killed on budgets of minutes (see the note on
      # that target before raising it).
      - name: Fuzz every target
        env:
          BOXER_FUZZ_TIME: ${{ inputs.fuzztime || '30s' }}
          BOXER_FUZZ_LOG_DIR: ${{ runner.temp }}/fuzz-logs
        run: ./scripts/ci/gofuzz.sh
      - name: Collect failing inputs
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fuzz-failures"
          git ls-files --others --exclude-standard -- '*/testdata/fuzz/*' > "$RUNNER_TEMP/fuzz-failures/files.txt"
          if [ -s "$RUNNER_TEMP/fuzz-failures/files.txt" ]; then
            tar -cf "$RUNNER_TEMP/fuzz-failures/inputs.tar" -T "$RUNNER_TEMP/fuzz-failures/files.txt"
          fi
          cat "$RUNNER_TEMP/fuzz-failures/files.txt"
      - name: Upload failing inputs and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: |
            ${{ runner.temp }}/fuzz-failures
            ${{ runner.temp }}/fuzz-logs
          if-no-files-found: ignore
          retention-days: 30
