name: License compliance

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  license_gate:
    name: license gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Setup
        run: ./scripts/ci/install.sh
      # The gate classifies every Rust crate tree too (ADR-0246), and
      # `cargo metadata` runs under each tree's own pin, so every pinned
      # channel has to be present. Read from the toolchain files, as lint.yaml
      # does, so a pin moves in one place. license_gate.sh fails rather than
      # skipping when cargo is absent.
      - name: Install the pinned Rust toolchains
        run: |
          set -euo pipefail
          channels=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust/*/rust-toolchain.toml rust/*/rust-toolchain 2>/dev/null | sort -u)
          [ -n "$channels" ] || { echo "no channel pin under rust/*/rust-toolchain{,.toml}" >&2; exit 1; }
          for ch in $channels; do
            rustup toolchain install "$ch" --profile minimal --component rustfmt,clippy
          done
      - name: Check Licenses
        run: ./scripts/ci/license_gate.sh
