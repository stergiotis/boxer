name: nightly

# ADR-0390: the one workflow that tests main between releases. It runs the
# test lanes, the Go lint steps, the integration lane against a throwaway
# ClickHouse server, a benchmark smoke run, the viewer and watermark crates,
# and writes a coverage profile. When every job passes on main it moves
# refs/heads/last-green to the tested commit — only forward, never by force —
# so a consumer can pin a commit that passed. There is no push or pull-request
# trigger: the working gate stays local (scripts/ci/gate.sh), and the
# release-time workflows stay as they are.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gotest:
    name: gotest + coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Setup
        run: ./scripts/ci/install.sh
      - name: Check go.mod/go.sum are tidy
        run: go mod tidy --diff
      - name: Verify module checksums
        run: go mod verify
      # One run gives both the verdict and the profile: -coverpkg=./... makes
      # every test binary count every package it reaches. The profile is
      # written outside the checkout so the drift check does not see it.
      - name: Run tests with coverage
        run: ./scripts/ci/gotest.sh --check-drift --coverprofile "$RUNNER_TEMP/cover.out"
      - name: Coverage table
        if: always()
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/cover.out" ] || { echo "no profile written"; exit 0; }
          ./scripts/ci/cover_table.sh "$RUNNER_TEMP/cover.out" > "$RUNNER_TEMP/cover-table.md"
          {
            echo '## Coverage (-coverpkg=./...)'
            echo
            tail -n 1 "$RUNNER_TEMP/cover-table.md"
            echo
            echo 'Per package in the cover-table.md artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            ${{ runner.temp }}/cover.out
            ${{ runner.temp }}/cover-table.md
          if-no-files-found: ignore
          retention-days: 14

  gotest-binary-log:
    name: gotest (binary_log)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Setup
        run: ./scripts/ci/install.sh
      - name: Run binary_log Tests
        run: ./scripts/ci/gotest_binary_log.sh --check-drift

  lint-go:
    name: Go lint steps
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Setup
        run: ./scripts/ci/install.sh
      # idl-check regenerates the Rust side of the egui2 bindings, which the
      # generator formats with rust/imzero2's pinned rustfmt.
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          ch=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust/imzero2/rust-toolchain | head -1)
          [ -n "$ch" ] || { echo "no channel pin in rust/imzero2/rust-toolchain" >&2; exit 1; }
          rustup toolchain install "$ch" --profile minimal --component rustfmt
      - name: Lint
        run: ./scripts/ci/lint.sh gofmt go-vet staticcheck errcheck gov-gate designlint packageprops fetcher-discipline idl-check

  integration:
    name: integration lane + ClickHouse
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Setup
        run: ./scripts/ci/install.sh
      # A static build, pinned by version and SHA-256 in the script. The binary
      # also serves `clickhouse local`, which the default lane's probes look
      # for on PATH.
      - name: Install and start ClickHouse
        run: |
          set -euo pipefail
          ./scripts/ci/clickhouse_server.sh install "$RUNNER_TEMP/clickhouse"
          echo "$RUNNER_TEMP/clickhouse" >> "$GITHUB_PATH"
          ./scripts/ci/clickhouse_server.sh start "$RUNNER_TEMP/clickhouse"
      # With a server up, the default lane's probe-and-skip tests run for real.
      - name: Default lane against the server
        run: ./scripts/ci/gotest.sh --check-drift
      - name: Integration lane
        run: ./scripts/ci/gotest-integration.sh
      - name: Drift after the integration lane
        run: ./scripts/ci/check_drift.sh
      - name: ClickHouse logs
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/clickhouse/log/*.log || true

  bench-smoke:
    name: benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Setup
        run: ./scripts/ci/install.sh
      - name: Every benchmark once
        env:
          BOXER_BENCH_OUT: ${{ runner.temp }}/bench
        run: ./scripts/ci/gobench.sh smoke

  viewer:
    name: viewer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          ch=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust/imzero2-viewer/rust-toolchain.toml | head -1)
          [ -n "$ch" ] || { echo "no channel pin in rust/imzero2-viewer/rust-toolchain.toml" >&2; exit 1; }
          rustup toolchain install "$ch" --profile minimal --component rustfmt,clippy
      - name: Test
        run: ./scripts/ci/viewer_test.sh

  watermark:
    name: watermark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          ch=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust/watermark/rust-toolchain.toml | head -1)
          [ -n "$ch" ] || { echo "no channel pin in rust/watermark/rust-toolchain.toml" >&2; exit 1; }
          rustup toolchain install "$ch" --profile minimal --component rustfmt,clippy
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      # watermark_test.sh fails on a missing encoder itself; see watermark.yaml.
      - name: Test
        run: ./scripts/ci/watermark_test.sh

  last-green:
    name: advance last-green
    needs: [gotest, gotest-binary-log, lint-go, integration, bench-smoke, viewer, watermark]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # force=false makes the API refuse anything but a fast-forward, so the
      # ref never moves back to an older commit or across a rewritten main.
      - name: Fast-forward refs/heads/last-green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/last-green" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/last-green" -f sha="$GITHUB_SHA" -F force=false >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/last-green -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "last-green -> $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
